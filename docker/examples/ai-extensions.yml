# =============================================================================
# PolarDB Docker AI/向量数据库配置示例
# =============================================================================
# 包含 pgvector 等向量搜索扩展
# 适合 AI 和机器学习应用
# =============================================================================

extension_sets:
  # 核心监控
  core:
    - polar_monitor
    - polar_audit

  # 向量搜索和 AI 扩展
  ai_full:
    - pgvector               # 向量相似度搜索
    - timescaledb            # 时序数据库
    - hll                    # HyperLogLoG 基数估计

default_sets: [core, ai_full]
