# =============================================================================
# PolarDB Docker 镜像扩展配置文件
# =============================================================================
#
# 此配置文件用于声明式指定要在 Docker 镜像中包含的 PostgreSQL 扩展。
# 支持三种扩展类型：
#   1. PolarDB 内置扩展 - 来自 external/ 目录的扩展
#   2. Pigsty 扩展 - 来自 Pigsty 仓库的 440+ 扩展
#   3. 自定义扩展 - 从 git 仓库或自定义源安装的扩展
#
# 使用说明：
#   1. 定义 extension_sets：创建可重用的扩展集合
#   2. 设置 default_sets：指定默认要构建的集合
#   3. （可选）配置 os_overrides：为特定 OS 版本添加或排除扩展
#   4. （可选）配置 extension_sources：指定自定义扩展的源
#
# =============================================================================

# -----------------------------------------------------------------------------
# 扩展集合定义
# -----------------------------------------------------------------------------
# 在此定义可重用的扩展集合。每个集合都有一个名称和扩展列表。
# 集合可以在 default_sets 中引用，方便不同场景的组合。
# -----------------------------------------------------------------------------

extension_sets:

  # -------------------------------------------------------------------------
  # PolarDB 核心扩展集
  #
  # 包含 PolarDB 的核心监控和管理扩展，这些扩展提供关键的数据库
  # 运维能力，包括审计、监控、资源管理等功能。
  # -------------------------------------------------------------------------
  polar_core:
    - polar_audit              # 审计日志扩展
    - polar_monitor            # 性能监控扩展
    - polar_resource_manager   # 资源管理扩展
    - polar_parameter_manager  # 参数管理扩展
    - polar_password_policy    # 密码策略扩展
    - polar_proxy_utils        # 代理工具扩展

  # -------------------------------------------------------------------------
  # PolarDB 完整扩展集
  #
  # 包含所有 PolarDB 内置扩展（除了 faultinjector）
  # 适用于需要完整 PolarDB 功能的场景
  # -------------------------------------------------------------------------
  polar_full:
    # 核心扩展（始终包含）
    - polar_audit
    - polar_feature_utils
    - polar_io_stat
    - polar_login_history
    - polar_masking
    - polar_monitor
    - polar_monitor_preload
    - polar_parameter_manager
    - polar_password_policy
    - polar_proxy_utils
    - polar_resource_manager
    - polar_smgrperf
    - polar_stat_env
    - polar_worker
    # 可选扩展（非 minimal 模式）
    - hll
    - hypopg
    - log_fdw
    - pase
    - pg_bigm
    - pg_jieba
    - pg_repack
    - pgvector
    - polar_sql_mapping
    - roaringbitmap

  # -------------------------------------------------------------------------
  # 空间数据库扩展集
  #
  # 包含 PostGIS 和 pgRouting 等地理空间扩展，用于 GIS 应用
  # -------------------------------------------------------------------------
  spatial:
    - postgis                # 地理空间对象支持
    - postgis_raster         # 栅格数据支持
    - postgis_sfcgal         # SFCGAL 几何引擎
    - postgis_tiger_geocoder # TIGER 地理编码器
    - address_standardizer   # 地址标准化
    - pgrouting              # 路由算法
    - ogr_fdw                # OGR 外部数据包装器
    - pggeoip                # GeoIP 支持

  # -------------------------------------------------------------------------
  # 向量搜索和 AI 扩展集
  #
  # 包含向量数据库和机器学习相关扩展
  # -------------------------------------------------------------------------
  ai_vector:
    - pgvector               # 向量相似度搜索
    - timescaledb            # 时序数据库
    - pg_analytics           # 分析函数

  # -------------------------------------------------------------------------
  # 全文搜索扩展集
  #
  # 包含文本搜索和自然语言处理扩展
  # -------------------------------------------------------------------------
  fulltext_search:
    - pg_bigm                # 双字符匹配 N-gram 全文搜索
    - pg_jieba               # 中文分词
    - pg_trgm                # 三字符匹配（PostgreSQL 内置）
    - zhparser               # 中文解析器

  # -------------------------------------------------------------------------
  # 数据分析和复制扩展集
  #
  # 包含数据分析、复制和数据导入相关扩展
  # -------------------------------------------------------------------------
  analytics:
    - hll                    # HyperLogLog 基数估计
    - tdigest                # T-Digest 近似算法
    - pg_repack              # 表碎片整理
    - hypopg                 # 虚拟索引测试
    - log_fdw                # 日志外部数据包装器

  # -------------------------------------------------------------------------
  # Pigsty 扩展示例集
  #
  # 来自 Pigsty 仓库的常用扩展（需要配置 Pigsty 仓库）
  # Pigsty 提供 440+ PostgreSQL 扩展，这里列出一些常用的
  # -------------------------------------------------------------------------
  pigsty_common:
    - pgvector               # 向量搜索
    - timescaledb            # 时序数据
    - postgis                # 空间数据
    - pgrouting              # 路由算法
    - pg_repack              # 碎片整理
    - pg_stat_statements     # 查询统计（PostgreSQL 内置）
    - pg_auto_failover       # 自动故障转移
    - pg_cron                # 任务调度
    - plv8                   # JavaScript 语言支持

# -----------------------------------------------------------------------------
# 默认扩展集合
# -----------------------------------------------------------------------------
# 指定默认构建时要包含的扩展集合。可以指定多个集合，所有集合中的
# 扩展都会被安装。
#
# 示例：
#   default_sets: [polar_core, spatial]
#   default_sets: [polar_full]
#   default_sets: []
# -----------------------------------------------------------------------------

default_sets: [polar_core]

# -----------------------------------------------------------------------------
# OS 特定覆盖
# -----------------------------------------------------------------------------
# 为特定的操作系统版本添加或排除扩展。当某个 OS 版本需要特殊处理时
# 使用此配置。
#
# 支持的 OS 版本标识符：
#   - Ubuntu: ubuntu20.04, ubuntu22.04, ubuntu24.04
#   - Anolis: anolis8, anolis23
#
# 配置选项：
#   - additional_extensions: 额外添加的扩展列表
#   - exclude_extensions: 要排除的扩展列表
# -----------------------------------------------------------------------------

os_overrides:
  # Ubuntu 24.04 使用较新的包版本，可能有一些额外的扩展可用
  ubuntu24.04:
    additional_extensions:
      - pg_stat_kcache        # 缓存统计（如果可用）
    exclude_extensions: []

  # Anolis 8 基于 RHEL 7，某些扩展可能不可用
  anolis8:
    additional_extensions: []
    exclude_extensions:
      - pg_analytics          # 假设在旧版本 RHEL 上不可用

  # Anolis 23 基于 RHEL 9，支持所有现代扩展
  anolis23:
    additional_extensions: []
    exclude_extensions: []

# -----------------------------------------------------------------------------
# 扩展源配置
# -----------------------------------------------------------------------------
# 配置扩展的安装源。默认情况下，扩展会从以下来源安装：
#   1. PolarDB 扩展：从源码编译（external/ 目录）
#   2. Pigsty 扩展：从 Pigsty 仓库安装
#   3. 系统扩展：从 OS 包管理器安装
#
# 对于自定义扩展，可以在此指定其来源。
# -----------------------------------------------------------------------------

extension_sources:
  # -------------------------------------------------------------------------
  # Pigsty 扩展仓库配置
  # -------------------------------------------------------------------------
  pigsty:
    enabled: false                    # 是否启用 Pigsty 仓库
    repo_url:
      ubuntu: "https://repo.pigsty.io/apt"
      anolis: "https://repo.pigsty.io/yum"
    # Pigsty 提供的扩展会自动通过 'pig' 包管理器安装

  # -------------------------------------------------------------------------
  # 自定义扩展源
  # -------------------------------------------------------------------------
  # 可以添加从 git 仓库或自定义 URL 安装的扩展
  #
  # 示例：
  #   custom:
  #     - name: my_custom_extension
  #       type: git
  #       url: https://github.com/user/pg_extension.git
  #       branch: main
  #       build_from_source: true
  #
  #     - name: another_extension
  #       type: url
  #       url: https://example.com/extension.tar.gz
  #       checksum: sha256:abc123...
  # -------------------------------------------------------------------------

  custom: []

# =============================================================================
# 配置验证和最佳实践
# =============================================================================
#
# 配置验证：
#   - 扩展名称必须有效（存在于元数据库或源中）
#   - OS 版本标识符必须是支持的值
#   - YAML 语法必须正确
#
# 最佳实践：
#   1. 从 small 开始：先使用 minimal 配置测试
#   2. 按需添加：根据实际需求逐步添加扩展
#   3. 注意依赖：某些扩展有依赖关系（如 postgis_radar 依赖 postgis）
#   4. 测试验证：构建后验证扩展是否正确安装
#   5. 文档参考：查看扩展文档了解配置和使用方法
#
# 故障排除：
#   - 如果扩展安装失败，检查扩展名称是否正确
#   - 查看构建日志了解详细的错误信息
#   - 某些扩展可能需要额外的系统库或配置
#   - 使用 os_overrides 排除在特定 OS 上不可用的扩展
#
# =============================================================================
